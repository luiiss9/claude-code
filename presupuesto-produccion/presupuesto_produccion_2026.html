<style>
:root{--bg:#eef1f8;--card:#fff;--tx:#141b2d;--mut:#66708a;--bd:#e1e6f1;--pri:#4f46e5;--pri2:#eceafd;--acc:#06b6d4;--ok:#0f9d67;--warn:#d98a06;--bad:#e5484d;--hd:#f5f7fc;--sh:0 4px 20px rgba(30,40,90,.08);--grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#06b6d4 130%)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f1c;--card:#141a2c;--tx:#e8ecf7;--mut:#8f9bb8;--bd:#252e48;--pri:#8b83ff;--pri2:#22224a;--acc:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#ff6b6f;--hd:#1a2136;--sh:0 4px 24px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0b0f1c;--card:#141a2c;--tx:#e8ecf7;--mut:#8f9bb8;--bd:#252e48;--pri:#8b83ff;--pri2:#22224a;--acc:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#ff6b6f;--hd:#1a2136;--sh:0 4px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(900px 400px at 85% -100px,rgba(79,70,229,.14),transparent),radial-gradient(700px 400px at -5% 0,rgba(6,182,212,.10),transparent);background-attachment:fixed}
header{background:var(--grad);color:#fff;padding:16px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:relative;overflow:hidden}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
header::before{width:340px;height:340px;right:-90px;top:-170px}header::after{width:200px;height:200px;left:38%;bottom:-130px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:24px;border:1px solid rgba(255,255,255,.3)}
.brand h1{font-size:21px;margin:0;letter-spacing:-.3px}.brand h1 b{background:linear-gradient(90deg,#fff,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:12px;opacity:.85;font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;position:relative;z-index:1}
header label.f{color:rgba(255,255,255,.8)}
header select,header button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
header select option{color:#111}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;transition:.15s}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:1px}
button{cursor:pointer;font-weight:500}button:hover{border-color:var(--pri);transform:translateY(-1px)}
button.pri{background:var(--grad);color:#fff;border:0;padding:9px 16px;box-shadow:0 6px 16px rgba(79,70,229,.35)}
button.pri:hover{box-shadow:0 8px 22px rgba(79,70,229,.5)}
label.f{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 24px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
nav button{border:0;border-radius:999px;background:transparent;padding:8px 14px;white-space:nowrap;color:var(--mut)}
nav button:hover{background:var(--pri2);color:var(--pri);transform:none}
nav button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}
main{padding:22px 24px 60px;max-width:1560px;margin:auto}
.panel{display:none}.panel.on{display:block;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--grad)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;background:var(--grad);color:#fff;border-radius:24px;padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 18px 44px rgba(79,70,229,.35)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-120px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:12px;opacity:.85}
.hero .big{font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:6px 0}
.hero p{margin:0;opacity:.92;font-size:15px;max-width:60ch}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:600;font-size:13px;margin-right:6px}
.hero-side{display:flex;gap:22px;align-items:center;justify-content:center;position:relative;z-index:1;flex-wrap:wrap}
.ring{--v:50;width:130px;height:130px;border-radius:50%;background:conic-gradient(#fff calc(var(--v)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:13px;border-radius:50%;background:#5b4fe0}
.ring span{position:relative;text-align:center;font-weight:800;font-size:22px;line-height:1.1}.ring small{display:block;font-size:10px;font-weight:500;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:.2s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(79,70,229,.18)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,var(--pri)) 16%,transparent);margin-bottom:8px}
.kpi b{display:block;font-size:25px;letter-spacing:-.5px;margin:2px 0}.kpi span{color:var(--mut);font-size:12px}
.kpi .dl{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:600;font-size:11.5px}
.kpi .dl.up{background:color-mix(in srgb,var(--bad) 14%,transparent)}.kpi .dl.dn{background:color-mix(in srgb,var(--ok) 14%,transparent)}.kpi .dl.neu{background:var(--hd)}
.up{color:var(--bad)}.dn{color:var(--ok)}.neu{color:var(--mut)}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--pri) 5%,var(--card))}
th{background:var(--hd);position:sticky;top:0;z-index:2;font-weight:600;color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.4px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--hd);z-index:3}
tr.grp td{background:var(--pri2);font-weight:600;color:var(--pri)}
tr.sub td{font-weight:600;background:var(--hd)}
tr.tot td{font-weight:700;border-top:2px solid var(--pri)}
td input,td select{width:84px;padding:3px 6px;text-align:right}td select{width:auto}
.drop{border:2px dashed color-mix(in srgb,var(--pri) 45%,var(--bd));border-radius:20px;padding:44px 20px;text-align:center;color:var(--mut);background:linear-gradient(180deg,var(--pri2),transparent);transition:.2s}
.drop .up-ic{font-size:44px;display:block;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.drop.hov{border-color:var(--pri);transform:scale(1.01)}
.alert{padding:10px 14px;border-radius:12px;margin:6px 0;border-left:4px solid}
.alert.w{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.alert.b{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.alert.i{border-color:var(--pri);background:var(--pri2)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}
.chart{position:relative;height:310px}
.hint{color:var(--mut);font-size:12px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.map label{display:flex;flex-direction:column;font-size:11px;color:var(--mut)}.map select{width:100%}
.landing{text-align:center;padding:34px 10px 10px}
.landing h2{font-size:clamp(26px,4vw,42px);letter-spacing:-1px;margin:0 0 10px}.landing h2::before{display:none}
.landing h2 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.landing p.lead{max-width:62ch;margin:0 auto 22px;color:var(--mut);font-size:16px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:26px 0}
.feat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:left;box-shadow:var(--sh);transition:.2s}
.feat:hover{transform:translateY(-4px)}.feat i{font-style:normal;font-size:26px;display:block;margin-bottom:6px}.feat b{display:block}.feat span{color:var(--mut);font-size:12.5px}
.steps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.steps span{background:var(--pri2);color:var(--pri);padding:6px 14px;border-radius:999px;font-weight:600;font-size:12.5px}
.heat{display:grid;gap:3px;font-size:11px}
.heat div{padding:7px 2px;text-align:center;border-radius:6px;font-weight:600}
.heat .h{background:none;color:var(--mut);font-weight:500}.heat .n{text-align:left;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;font-weight:500}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:22px}header{padding:14px}main{padding:14px}.g2{grid-template-columns:1fr}}
@media print{header,nav,.noprint{display:none!important}.panel{display:block!important;page-break-after:always}.card,.kpi{box-shadow:none}.tw{max-height:none}body{background:#fff}}
</style>

const $=s=>document.querySelector(s);
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const nf=(d=0)=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const f0=nf(0),f1=nf(1),f2=nf(2);
const eur=v=>f0.format(v)+' €',eur2=v=>f2.format(v)+' €';
const pct=v=>isFinite(v)?(v>0?'+':'')+f1.format(v)+'%':'—';
const sum=a=>a.reduce((x,y)=>x+y,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dpct=(n,o)=>o?(n/o-1)*100:NaN;
const dcls=(d,inv=true)=>!isFinite(d)||Math.abs(d)<.05?'neu':((d>0)===inv?'up':'dn');
function toNum(v){if(typeof v==='number')return isFinite(v)?v:0;if(v==null||v==='')return 0;
  let s=String(v).replace(/[€$\s%]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?n:0}
function toMonth(v){if(v instanceof Date)return v.getMonth()+1;if(typeof v==='number'){if(v>=1&&v<=12)return Math.round(v);if(v>20000)return new Date(Math.round((v-25569)*864e5)).getUTCMonth()+1;return 0}
  const s=norm(v);if(/^\d+$/.test(s)){const n=+s;return n>=1&&n<=12?n:0}
  const i=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'].indexOf(s.slice(0,3));if(i>=0)return i+1;
  const j=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(s.slice(0,3));return j>=0?j+1:0}
function pearson(x,y){const n=x.length;if(n<4)return NaN;const mx=sum(x)/n,my=sum(y)/n;let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):NaN}
function toast(m,t='i'){const d=document.createElement('div');d.className='alert '+t;d.style.cssText='position:fixed;right:16px;bottom:16px;z-index:99;max-width:340px;background:var(--card)';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}

function loadFile(file){const rd=new FileReader();rd.onload=e=>{try{S.wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});S.fname=file.name;S.sheets=S.wb.SheetNames;
  let best=S.sheets[0],bl=-1;S.sheets.forEach(n=>{const l=XLSX.utils.sheet_to_json(S.wb.Sheets[n],{header:1}).length;if(l>bl){bl=l;best=n}});setSheet(best)}catch(err){toast('No se pudo leer el archivo: '+err.message,'b')}};rd.readAsArrayBuffer(file)}
function loadSample(){if(!SAMPLE_CSV){toast('Sin datos de ejemplo incrustados','w');return}S.wb=XLSX.read(SAMPLE_CSV,{type:'string',cellDates:true});S.fname='datos_ejemplo_2025.csv';S.sheets=S.wb.SheetNames;setSheet(S.sheets[0])}
function setSheet(n){S.sheet=n;S.raw=XLSX.utils.sheet_to_json(S.wb.Sheets[n],{defval:'',raw:true});S.headers=S.raw.length?Object.keys(S.raw[0]):[];autoMap();buildRows()}
function autoMap(){const H=S.headers.map(h=>[h,norm(h)]),used=new Set();S.mapping={};
  const find=(key,al)=>{const cands=[key,...al];for(const c of cands){const h=H.find(x=>x[1]===c&&!used.has(x[0]));if(h)return h[0]}
    for(const c of cands){if(c.length<5)continue;const h=H.find(x=>!used.has(x[0])&&(x[1].includes(c)))||H.find(x=>!used.has(x[0])&&x[1].length>=5&&c.includes(x[1]));if(h)return h[0]}return''};
  // primero coincidencias exactas para evitar solapes
  const items=[...FIELDS.map(f=>[f[0],f[0],f[2]]),...CONCEPTS.map(c=>[c.k,c.k,c.alias])];
  items.forEach(([k,key,al])=>{const h=H.find(x=>[key,...al].includes(x[1])&&!used.has(x[0]));if(h){S.mapping[k]=h[0];used.add(h[0])}});
  items.forEach(([k,key,al])=>{if(S.mapping[k])return;const h=find(key,al);S.mapping[k]=h;if(h)used.add(h)})}
function buildRows(){const M=S.mapping,rows=[],issues=[];
  S.raw.forEach((r,i)=>{const g=k=>M[k]?r[M[k]]:'';let mo=toMonth(g('month'));if(!mo&&M.date)mo=toMonth(g('date'));
    let yr=+g('year')||0;if(!yr&&M.date){const d=g('date');if(d instanceof Date)yr=d.getFullYear()}
    if(!mo){issues.push({t:'w',m:`Fila ${i+2}: mes no reconocido, se ignora.`});return}
    const o={line:i+2,year:yr||0,month:mo,product:String(g('product')||'Producción total').trim(),family:String(g('family')||'General').trim(),plant:String(g('plant')||'General').trim(),
      units:toNum(g('units')),defu:toNum(g('defu')),hours:toNum(g('hours')),cap:toNum(g('cap')),cost:{}};
    CONCEPTS.forEach(c=>{o.cost[c.k]=M[c.k]?toNum(r[M[c.k]]):0});rows.push(o)});
  S.rows=rows;S.issues=issues;quality();initFilters();recalc();renderAll()}
function quality(){const I=S.issues,by={};
  S.rows.forEach(r=>{const k=[r.year,r.plant,r.product,r.month].join('|');(by[k]=by[k]||[]).push(r);
    if(r.units<=0)I.push({t:'w',m:`Fila ${r.line} (${r.product}, mes ${r.month}): unidades = 0 o negativas.`});
    CONCEPTS.forEach(c=>{if(r.cost[c.k]<0)I.push({t:'w',m:`Fila ${r.line}: coste negativo en ${c.label}.`})})});
  Object.values(by).forEach(a=>{if(a.length>1)I.push({t:'b',m:`Duplicado: ${a[0].product}, mes ${a[0].month}, año ${a[0].year} aparece ${a.length} veces (se sumarán).`})});
  const pm={};S.rows.forEach(r=>{const k=r.year+'|'+r.product;(pm[k]=pm[k]||new Set()).add(r.month)});
  Object.entries(pm).forEach(([k,s])=>{if(s.size<12)I.push({t:'w',m:`${k.replace('|',' · ')}: solo ${s.size} de 12 meses con datos (la estacionalidad se normaliza).`})});
  const pr={};S.rows.forEach(r=>{if(r.units>0){const t=sum(Object.values(r.cost))/r.units;(pr[r.product]=pr[r.product]||[]).push([r,t])}});
  Object.values(pr).forEach(a=>{if(a.length<6)return;const v=a.map(x=>x[1]),m=sum(v)/v.length,sd=Math.sqrt(sum(v.map(x=>(x-m)**2))/v.length);
    a.forEach(([r,t])=>{if(sd&&Math.abs(t-m)/sd>2.7)I.push({t:'w',m:`Valor atípico: ${r.product}, fila ${r.line}, coste unitario ${f2.format(t)} € (media ${f2.format(m)} €).`})})});
  if(S.rows.length&&!S.mapping.units)I.push({t:'b',m:'No se ha detectado la columna de unidades producidas: mapéala manualmente.'});
  const nmap=CONCEPTS.filter(c=>S.mapping[c.k]).length;I.push({t:'i',m:`${S.rows.length} filas válidas · ${nmap}/${CONCEPTS.length} partidas de coste detectadas.`})}
function initFilters(){const ys=[...new Set(S.rows.map(r=>r.year))].sort();S.baseYear=ys.includes(S.baseYear)?S.baseYear:ys[ys.length-1];
  const fill=(id,vals,all)=>{$(id).innerHTML=(all?`<option value="">${all}</option>`:'')+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')};
  fill('#fYear',ys);$('#fYear').value=S.baseYear;
  fill('#fPlant',[...new Set(S.rows.map(r=>r.plant))].sort(),'Todas');fill('#fFam',[...new Set(S.rows.map(r=>r.family))].sort(),'Todas');
  S.plant='';S.fam='';$('#fScen').innerHTML=Object.entries(S.scenarios).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');$('#fScen').value=S.scen}

/* ============ Motor de cálculo ============ */
function baseAgg(){const P={};
  S.rows.forEach(r=>{if(r.year!==S.baseYear||(S.plant&&r.plant!==S.plant)||(S.fam&&r.family!==S.fam))return;
    const p=P[r.product]=P[r.product]||{name:r.product,family:r.family,plant:r.plant,units:0,mu:Array(12).fill(0),cap:0,defu:0,hours:0,cost:{},mc:{}};
    const m=r.month-1;p.units+=r.units;p.mu[m]+=r.units;p.cap=Math.max(p.cap,r.cap);p.defu+=r.defu;p.hours+=r.hours;
    CONCEPTS.forEach(c=>{p.cost[c.k]=(p.cost[c.k]||0)+r.cost[c.k];(p.mc[c.k]=p.mc[c.k]||Array(12).fill(0))[m]+=r.cost[c.k]})});
  Object.values(P).forEach(p=>{CONCEPTS.forEach(c=>{p.cost[c.k]=p.cost[c.k]||0;p.mc[c.k]=p.mc[c.k]||Array(12).fill(0)});p.total=sum(CONCEPTS.map(c=>p.cost[c.k]));p.uc=p.units?p.total/p.units:0});
  return P}
function compute(o={}){const base=baseAgg(),par=S.par,sc=S.scenarios[o.scen||S.scen]||SCEN0.base,vm=o.volMult??1,gm=o.gMult||{};
  const out={base,prods:{},T:{units:Array(12).fill(0),cost:{},tot:Array(12).fill(0)},sc};
  CONCEPTS.forEach(c=>out.T.cost[c.k]=Array(12).fill(0));
  const names=Object.keys(base);let unitsAll=0;
  names.forEach(n=>{const b=base[n],g=(par.growth+(par.prodG[n]||0)+sc.vol)/100,U=b.units*(1+g)*vm;
    let sh=par.seas==='flat'?Array(12).fill(1/12):(b.units?b.mu.map(x=>x/b.units):Array(12).fill(1/12));
    const ss=sum(sh);sh=ss?sh.map(x=>x/ss):Array(12).fill(1/12);
    const units=sh.map(x=>x*U),cost={};
    CONCEPTS.forEach(c=>{const cp=par.conc[c.k],infl=cp.infl+sc.price;let eff=+cp.eff+sc.eff+(c.g==='des'?+par.quality:0);eff=Math.max(-50,Math.min(90,eff));
      const f=(1+infl/100)*(1-eff/100)*(gm[c.g]??1);
      if(cp.type==='V'){const uc=b.units?b.cost[c.k]/b.units:0;cost[c.k]=units.map(u=>u*uc*f)}
      else{const tot=b.cost[c.k]*f,s=sum(b.mc[c.k]);cost[c.k]=(s?b.mc[c.k].map(x=>x/s):Array(12).fill(1/12)).map(x=>x*tot)}});
    out.prods[n]={name:n,family:b.family,plant:b.plant,units,cost,uY:sum(units),cap:b.cap};unitsAll+=sum(units)});
  const ex=+par.extraAmort||0;if(ex&&unitsAll)names.forEach(n=>{const p=out.prods[n],a=ex*p.uY/unitsAll/12;p.cost.amortizacion=p.cost.amortizacion.map(x=>x+a)});
  names.forEach(n=>{const p=out.prods[n];p.tot=Array(12).fill(0);
    CONCEPTS.forEach(c=>{p.cost[c.k].forEach((v,m)=>{p.tot[m]+=v;out.T.cost[c.k][m]+=v})});
    p.totY=sum(p.tot);p.uc=p.uY?p.totY/p.uY:0;p.units.forEach((u,m)=>out.T.units[m]+=u);p.tot.forEach((t,m)=>out.T.tot[m]+=t)});
  out.uY=sum(out.T.units);out.totY=sum(out.T.tot);out.uc=out.uY?out.totY/out.uY:0;
  out.b={units:sum(names.map(n=>base[n].units)),tot:sum(names.map(n=>base[n].total))};out.b.uc=out.b.units?out.b.tot/out.b.units:0;
  return out}
function grpSum(res,g,prod){return sum(CONCEPTS.filter(c=>c.g===g).map(c=>sum(prod?res.prods[prod].cost[c.k]:res.T.cost[c.k])))}
function grpBase(g,prod){const b=B;return sum(CONCEPTS.filter(c=>c.g===g).map(c=>prod?b[prod].cost[c.k]:sum(Object.values(b).map(p=>p.cost[c.k]))))}
function fixedVar(res,scen){let fx=0,vr=0;CONCEPTS.forEach(c=>{const t=sum(res.T.cost[c.k]);if(S.par.conc[c.k].type==='F')fx+=t;else vr+=t});return{fx,vr}}
function recalc(){R=S.rows.length?compute():null;B=R?R.base:null}

function renderDatos(){const el=$('#p-datos');
  const map=S.headers.length?`<div class="card"><h2>Mapeo de columnas</h2><p class="hint">Se detectan automáticamente por nombre. Corrige lo que haga falta; las partidas sin columna se toman como 0.</p>

  el.innerHTML=(S.rows.length?'':landing())+`<div class="card"><h2>Carga tus datos de producción</h2>

function countUp(root){const F={n0:v=>f0.format(v),eur:eur,eur2:eur2};root.querySelectorAll('[data-n]').forEach(el=>{const t=+el.dataset.n,f=F[el.dataset.f]||F.n0,t0=performance.now();

    const d=dpct(p.uc,R.base[n].uc);if(d>6)A.push({t:'w',m:`${n}: el coste unitario sube ${pct(d)} (${f2.format(R.base[n].uc)} € → ${f2.format(p.uc)} €).`})});

  $('#p-flex').innerHTML=`<div class="card"><h2>Presupuesto flexible (costes fijos + variables según niveles de actividad)</h2>
  <div class="row"><label class="f">Nivel mín. %<input type="number" data-flex="min" value="${S.flex.min}"></label><label class="f">Nivel máx. %<input type="number" data-flex="max" value="${S.flex.max}"></label><label class="f">Paso %<input type="number" data-flex="step" value="${S.flex.step}"></label></div>
  <p class="hint">100% = volumen presupuestado (${f0.format(R.uY)} uds). Fijo: ${eur(fv.fx)} · Variable a 100%: ${eur(fv.vr)} (${eur2(R.uY?fv.vr/R.uY:0)}/ud).</p>
  <div class="tw"><table><tr><th>Nivel actividad</th><th>Unidades</th><th>Costes variables</th><th>Costes fijos</th><th>Coste total</th><th>Coste unitario</th><th>Δ vs 100%</th></tr>
  ${rows.map(r=>`<tr class="${r.l===100?'tot':''}"><td>${r.l}%</td><td>${f0.format(r.u)}</td><td>${f0.format(r.v)}</td><td>${f0.format(r.f)}</td><td>${f0.format(r.t)}</td><td>${f2.format(r.uc)}</td><td>${pct(dpct(r.t,R.totY))}</td></tr>`).join('')}</table></div></div>
  <div class="grid g2"><div class="card"><h2>Costes por nivel de actividad</h2><div class="chart"><canvas id="cf1"></canvas></div></div><div class="card"><h2>Coste unitario por nivel</h2><div class="chart"><canvas id="cf2"></canvas></div></div></div>`;
  mkChart('cf1',{type:'line',data:{labels:rows.map(r=>r.l+'%'),datasets:[{label:'Total',data:rows.map(r=>r.t),borderColor:'#6d5ff0'},{label:'Fijos',data:rows.map(r=>r.f),borderColor:'#bf8f00'},{label:'Variables',data:rows.map(r=>r.v),borderColor:'#548235'}]}});
  mkChart('cf2',{type:'line',data:{labels:rows.map(r=>r.l+'%'),datasets:[{label:'€/ud',data:rows.map(r=>r.uc),borderColor:'#c0392b',fill:true,backgroundColor:'rgba(192,57,43,.1)'}]}})}

function renderMaestro(){const ns=Object.keys(R.prods);
  const std=n=>{const p=R.prods[n];return GKEYS.map(g=>grpSum(R,g,n)/(p.uY||1))};
  $('#p-maestro').innerHTML=`<div class="card"><h2>Presupuesto maestro de fabricación = volumen previsto × costes unitarios estándar</h2>
  <div class="tw"><table><tr><th>Producto</th><th>Uds previstas</th>${GKEYS.map(g=>`<th>${G[g].split(' (')[0].replace('Costes ','').replace('Consumos directos de ','')} €/ud</th>`).join('')}<th>Coste estándar €/ud</th><th>Presupuesto maestro</th></tr>
  ${ns.map(n=>{const s=std(n),p=R.prods[n];return`<tr><td>${esc(n)}</td><td>${f0.format(p.uY)}</td>${s.map(v=>`<td>${f2.format(v)}</td>`).join('')}<td>${f2.format(sum(s))}</td><td>${f0.format(sum(s)*p.uY)}</td></tr>`}).join('')}
  <tr class="tot"><td>TOTAL</td><td>${f0.format(R.uY)}</td>${GKEYS.map(g=>`<td>${f2.format(grpSum(R,g)/R.uY)}</td>`).join('')}<td>${f2.format(R.uc)}</td><td>${f0.format(R.totY)}</td></tr></table></div></div>
  <div class="card"><h2>Volumen mensual previsto por producto (uds)</h2><div class="tw"><table><tr><th>Producto</th>${MESES.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr>
  ${ns.map(n=>`<tr><td>${esc(n)}</td>${R.prods[n].units.map(v=>`<td>${f0.format(v)}</td>`).join('')}<td>${f0.format(R.prods[n].uY)}</td></tr>`).join('')}<tr class="tot"><td>TOTAL</td>${R.T.units.map(v=>`<td>${f0.format(v)}</td>`).join('')}<td>${f0.format(R.uY)}</td></tr></table></div></div>
  <div class="card"><h2>Presupuesto mensual por producto (€)</h2><div class="tw"><table><tr><th>Producto</th>${MESES.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr>
  ${ns.map(n=>`<tr><td>${esc(n)}</td>${R.prods[n].tot.map(v=>`<td>${f0.format(v)}</td>`).join('')}<td>${f0.format(R.prods[n].totY)}</td></tr>`).join('')}<tr class="tot"><td>TOTAL</td>${R.T.tot.map(v=>`<td>${f0.format(v)}</td>`).join('')}<td>${f0.format(R.totY)}</td></tr></table></div></div>`}

function renderEscen(){const el=$('#p-escen'),keys=Object.keys(S.scenarios),res=keys.map(k=>compute({scen:k}));
  const sens=[['Volumen +10%',{volMult:1.1}],['Volumen −10%',{volMult:.9}],['Materiales +10%',{gMult:{mat:1.1}}],['Materiales −10%',{gMult:{mat:.9}}],['Mano de obra +10%',{gMult:{mo:1.1}}],['Mano de obra −10%',{gMult:{mo:.9}}],['CIF +10%',{gMult:{cif:1.1}}],['CIF −10%',{gMult:{cif:.9}}],['Desperdicios +10%',{gMult:{des:1.1}}],['Desperdicios −10%',{gMult:{des:.9}}]].map(([l,o])=>[l,compute(o).totY-R.totY]);
  el.innerHTML=`<div class="card"><h2>Definición de escenarios</h2><p class="hint">Se suman a las hipótesis: variación de volumen (pp), variación de inflación/precios (pp) y variación del ahorro de eficiencia (pp).</p>
  <div class="tw"><table><tr><th>Escenario</th><th>Δ Volumen (pp)</th><th>Δ Precios (pp)</th><th>Δ Eficiencia (pp)</th><th>Uds</th><th>Coste total</th><th>€/ud</th><th>Δ vs base ${S.baseYear}</th></tr>
  ${keys.map((k,i)=>{const s=S.scenarios[k],r=res[i];return`<tr class="${k===S.scen?'sub':''}"><td>${esc(s.name)}</td><td><input type="number" step="0.5" data-path="scenarios.${k}.vol" value="${s.vol}"></td><td><input type="number" step="0.5" data-path="scenarios.${k}.price" value="${s.price}"></td><td><input type="number" step="0.5" data-path="scenarios.${k}.eff" value="${s.eff}"></td><td>${f0.format(r.uY)}</td><td>${f0.format(r.totY)}</td><td>${f2.format(r.uc)}</td><td class="${dcls(dpct(r.totY,r.b.tot))}">${pct(dpct(r.totY,r.b.tot))}</td></tr>`}).join('')}</table></div></div>
  <div class="grid g2"><div class="card"><h2>Comparativa de escenarios</h2><div class="chart"><canvas id="ce1"></canvas></div></div><div class="card"><h2>Sensibilidad del coste total (Δ € vs escenario actual)</h2><div class="chart"><canvas id="ce2"></canvas></div></div></div>`;
  mkChart('ce1',{type:'bar',data:{labels:keys.map(k=>S.scenarios[k].name),datasets:[{label:'Coste total',data:res.map(r=>r.totY),backgroundColor:PAL}]},options:{plugins:{legend:{display:false}}}});
  mkChart('ce2',{type:'bar',data:{labels:sens.map(s=>s[0]),datasets:[{data:sens.map(s=>s[1]),backgroundColor:sens.map(s=>s[1]>0?'#c0392b':'#1a7f4b')}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}})}

function longRows(){const out=[['Año','Mes','Planta','Familia','Producto','Unidades_Producidas',...CONCEPTS.map(c=>c.k),'Coste_Total']];
  Object.values(R.prods).forEach(p=>{for(let m=0;m<12;m++)out.push([S.baseYear+1,MESES[m],p.plant,p.family,p.name,Math.round(p.units[m]),...CONCEPTS.map(c=>+p.cost[c.k][m].toFixed(2)),+p.tot[m].toFixed(2)])});return out}
function renderExport(){$('#p-export').innerHTML=`<div class="card"><h2>Exportar presupuesto ${S.baseYear+1}</h2><div class="row noprint">
  <button class="pri" id="xX">Descargar Excel completo (.xlsx)</button><button id="xC">Descargar CSV detallado</button><button id="xP">Imprimir / guardar PDF</button></div>
  <p class="hint">El Excel incluye: Resumen, Mensual por concepto, Por producto, Flexible, Maestro, Escenarios, Hipótesis y Datos detallados (formato largo).</p></div>`;
  $('#xX').onclick=exportXlsx;$('#xC').onclick=()=>download(`presupuesto_produccion_${S.baseYear+1}.csv`,new Blob(['﻿'+longRows().map(r=>r.join(';')).join('\n')],{type:'text/csv'}));$('#xP').onclick=()=>window.print()}
function exportXlsx(){const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n),fv=fixedVar(R),ns=Object.keys(R.prods),Y=S.baseYear+1;
  add('Resumen',[[`Presupuesto de producción ${Y}`],['Escenario',S.scenarios[S.scen].name],[],['Indicador','Base '+S.baseYear,'Presupuesto '+Y,'Δ%'],['Unidades',R.b.units,R.uY,dpct(R.uY,R.b.units)],['Coste total',R.b.tot,R.totY,dpct(R.totY,R.b.tot)],['Coste unitario',R.b.uc,R.uc,dpct(R.uc,R.b.uc)],['Costes fijos','',fv.fx],['Costes variables','',fv.vr],[],['Grupo','Base','Presupuesto','Δ%'],...GKEYS.map(g=>[G[g],grpBase(g),grpSum(R,g),dpct(grpSum(R,g),grpBase(g))])]);
  add('Mensual',[['Concepto','Tipo',...MESES,'Total '+Y,'Base '+S.baseYear],['Unidades','',...R.T.units,R.uY,R.b.units],...CONCEPTS.map(c=>[c.label,S.par.conc[c.k].type,...R.T.cost[c.k],sum(R.T.cost[c.k]),sum(ns.map(n=>B[n].cost[c.k]))]),['TOTAL','',...R.T.tot,R.totY,R.b.tot]]);
  add('Por producto',[['Producto','Planta','Uds base','Uds '+Y,'Coste base','Coste '+Y,'€/ud base','€/ud '+Y],...ns.map(n=>[n,R.prods[n].plant,B[n].units,R.prods[n].uY,B[n].total,R.prods[n].totY,B[n].uc,R.prods[n].uc])]);
  add('Flexible',[['Nivel %','Unidades','Variables','Fijos','Total','€/ud'],...flexRows().map(r=>[r.l,r.u,r.v,r.f,r.t,r.uc])]);
  add('Maestro',[['Producto','Uds previstas',...GKEYS.map(g=>G[g]+' €/ud'),'Estándar €/ud','Presupuesto'],...ns.map(n=>{const p=R.prods[n],s=GKEYS.map(g=>grpSum(R,g,n)/(p.uY||1));return[n,p.uY,...s,sum(s),p.totY]})]);
  add('Escenarios',[['Escenario','Δ Vol','Δ Precio','Δ Efic','Uds','Coste total','€/ud'],...Object.keys(S.scenarios).map(k=>{const s=S.scenarios[k],r=compute({scen:k});return[s.name,s.vol,s.price,s.eff,r.uY,r.totY,r.uc]})]);
  add('Hipótesis',[['Global'],['Crecimiento volumen %',S.par.growth],['Estacionalidad',S.par.seas],['Mejora calidad %',S.par.quality],['Amortización adicional €',S.par.extraAmort],[],['Partida','Tipo','Inflación %','Ahorro %'],...CONCEPTS.map(c=>[c.label,S.par.conc[c.k].type,S.par.conc[c.k].infl,S.par.conc[c.k].eff])]);
  add('Datos detallados',longRows());XLSX.writeFile(wb,`presupuesto_produccion_${Y}.xlsx`)}

/* ============ Eventos y persistencia ============ */
function persist(){try{localStorage.setItem('ppf26',JSON.stringify({par:S.par,scenarios:S.scenarios}))}catch{}}
function restore(){try{const j=JSON.parse(localStorage.getItem('ppf26')||'null');if(j){Object.assign(S.par,j.par);if(j.scenarios)S.scenarios=j.scenarios;CONCEPTS.forEach(c=>{S.par.conc[c.k]=Object.assign({type:c.type,infl:c.infl,eff:c.eff},S.par.conc[c.k])})}}catch{}}
function setPath(path,val){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]]=o[p[i]]??{};o[p[p.length-1]]=val}
let deb;document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.path&&t.tagName==='INPUT'){setPath(t.dataset.path,t.value===''?0:+t.value);clearTimeout(deb);deb=setTimeout(()=>{recalc();persist();if(S.tab==='escen'){renderAll('escen');renderEscen();const n=document.querySelector(`[data-path="${t.dataset.path}"]`);n&&n.focus()}else renderAll(S.tab)},250)}
  if(t.dataset.flex){S.flex[t.dataset.flex]=+t.value||0;clearTimeout(deb);deb=setTimeout(()=>{if(R){const a=document.activeElement;renderFlex();const n=document.querySelector(`[data-flex="${t.dataset.flex}"]`);n&&n.focus()}},400)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.path&&t.tagName==='SELECT'){setPath(t.dataset.path,t.value);recalc();persist();renderAll()}
  if(t.dataset.map!==undefined){S.mapping[t.dataset.map]=t.value;buildRows()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){S.tab=b.dataset.tab;renderNav();window.scrollTo(0,0)}});
$('#fYear').onchange=e=>{S.baseYear=+e.target.value;recalc();renderAll()};
$('#fPlant').onchange=e=>{S.plant=e.target.value;recalc();renderAll()};
$('#fFam').onchange=e=>{S.fam=e.target.value;recalc();renderAll()};
$('#fScen').onchange=e=>{S.scen=e.target.value;recalc();renderAll()};
$('#btnTheme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dark?'light':'dark';if(R)renderAll()};
restore();initFilters();renderAll();
</script>
</body>
</html>
